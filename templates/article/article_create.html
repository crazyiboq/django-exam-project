{% extends "base.html" %}

{% block title %}Create Article | Exam Project{% endblock %}

{% block content %}

<div class="profile-container">

    <div class="profile-card">

        <h1>Create Article</h1>

        <form method="POST" enctype="multipart/form-data" class="article-create-form">

            {% csrf_token %}

            {% for field in form %}

                <div class="form-group">

                    <label for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% for error in field.errors %}
                        <div class="error-message">
                            {{ error }}
                        </div>
                    {% endfor %}

                </div>

            {% endfor %}

            <button type="submit" class="btn btn-secondary">
                Publish Article
            </button>

        </form>

        <br>

        <a href="{% url 'article_list' %}" class="btn btn-secondary">
            Cancel
        </a>

    </div>

</div>

{% endblock %}
