{% extends "base.html" %}

{% block title %}Edit Article{% endblock %}

{% block content %}

<div class="form-container">

    <div class="form-card">

        <h1>Edit Article</h1>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="primary-button">
                Save Changes
            </button>

            <a href="{% url 'article_detail' article.id %}"
               class="secondary-button">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
